[package]
name = "cross-platform-exchange"
authors = ["gRoussac <gRoussac@users.noreply.github.com>"]
version = "0.1.0"
edition = "2024"

[features]
library = []

[[bin]]
name = "schema"
path = "src/bin/schema.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sylvia = "1.3.0"
cw-storage-plus = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
thiserror = "*"
schemars = "0.9"
cosmwasm-schema = "2.2.2"

[dev-dependencies]
sylvia = { version = "1.3.0", features = ["mt"] }
