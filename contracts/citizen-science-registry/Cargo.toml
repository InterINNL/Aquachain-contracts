[package]
name = "citizen-science-registry"
authors = ["gRoussac <gRoussac@users.noreply.github.com>"]
version = "0.1.0"
edition = "2024"

[features]
library = []

[[bin]]
name = "schema"
path = "src/bin/schema.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sylvia = "1.3.0"
cw-storage-plus = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "*"
schemars = "0.9"
cosmwasm-schema = "2.2.2"
sha2 = "*"
hex = "*"

[dev-dependencies]
sylvia = { version = "1.3.0", features = ["mt"] }
